name: Quoting App CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "quoting-app/**"
      - ".github/workflows/quoting-app-deploy.yml"
  push:
    branches: [main]
    paths:
      - "quoting-app/**"
      - ".github/workflows/quoting-app-deploy.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: quoting-app

jobs:
  python-checks:
    name: Python Tests + Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quoting-app/backend/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pip-audit bandit

      - name: Run backend tests
        run: PYTHONPATH=backend pytest -q backend/tests

      - name: Bandit SAST (high severity)
        run: bandit -r backend -ll

      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt

  deploy:
    name: Deploy to Fly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python-checks]
    runs-on: ubuntu-latest
    concurrency: quoting-app-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke:
    name: Post-deploy smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${QUOTING_APP_URL}/api/health" >/dev/null; then
              echo "live"; exit 0
            fi
            sleep 5
          done
          echo "site never came up"; exit 1
        env:
          QUOTING_APP_URL: https://seb-quoting-app.fly.dev

      - name: Health check
        run: |
          curl -fsS "${QUOTING_APP_URL}/api/health" | grep -q '"status":"ok"' \
            || curl -fsS "${QUOTING_APP_URL}/api/health" | grep -q '"status": "ok"'
        env:
          QUOTING_APP_URL: https://seb-quoting-app.fly.dev
